name: Deploy to EC2

on:
  push:
    # paths:
    #   - "server/**"
    branches:
      - "wing"

jobs:
  deploy_to_ec2:
    permissions:
      contents: "read"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Store Private key to a PEM file
        run: |-
          printf "%s" "${{secrets.PRIVATE_KEY}}" > chat-up.pem
          chmod 600 chat-up.pem

      - name: Push files to EC2 instance
        run: |
          rsync -avz --exclude 'node_modules' --exclude '.git' --exclude '.env' \
          -e  "ssh -i chat-up.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
          ./server ubuntu@${{secrets.EC2_INSTANCE}}:~/app

      - name: SSH to EC2 instance and restart server
        run: |
          ssh -i "chat-up.pem" -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_INSTANCE }} << EOF
              source ~/.bashrc
              source ~/.profile
              cd ~/app/server
             
              corepack enable pnpm

              if ! command -v pnpm &> /dev/null; then
                echo "pnpm not found! Installing..."
                corepack prepare pnpm@latest --activate
              fi
             
              if ! command -v pm2 &> /dev/null; then
                echo "pm2 not found! Installing..."
                pnpm install -g pm2
              fi
              
              pnpm install
              pm2 restart chatup-server || pm2 start pnpm --name "chatup-server" -- production
          EOF
